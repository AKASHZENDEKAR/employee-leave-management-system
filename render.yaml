databases:
  - name: leave-management-db
    plan: free
    databaseName: leave_management_db
    user: leave_management_user
    postgresMajorVersion: "18"

services:
  - type: web
    name: leave-management-backend
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: bash build.sh

    startCommand: >
      python -m gunicorn
      config.asgi:application
      -k uvicorn.workers.UvicornWorker

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leave-management-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        value: https://leave-management-frontend-9d5r.onrender.com

  - type: web
    name: leave-management-frontend
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        value: https://leave-management-backend-gzxp.onrender.com/api
