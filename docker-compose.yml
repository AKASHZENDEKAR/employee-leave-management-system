services:

  db:
    image: postgres:18
    container_name: leave_management_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: leave_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leave_management_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: leave_management_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DJANGO_SECRET_KEY: docker-development-secret-key-change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend

      DB_NAME: leave_management_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"

      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend

    container_name: leave_management_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

volumes:
  postgres_data: